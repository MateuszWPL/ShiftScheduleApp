
services:
  postgres:
    image: postgres:15-alpine
    container_name: shift-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shift_schedule
    ports:
      - "5433:5432"  # <--- ZMIANA TUTAJ (Host:Kontener)
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: